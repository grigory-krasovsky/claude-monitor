name: CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Сборка и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Maven package
        run: ./mvnw -B clean package

  image:
    name: Публикация образа
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Имя образа в нижнем регистре
        id: meta
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Деплой на VPS
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_PATH: ${{ secrets.VPS_PATH || '/opt/claude-usage-monitor' }}
    steps:
      - uses: actions/checkout@v4

      - name: Каталог деплоя
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DEPLOY_PATH
          script_stop: true
          script: mkdir -p "$DEPLOY_PATH"

      - name: Копирование docker-compose.yml
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: docker-compose.yml
          target: ${{ secrets.VPS_PATH || '/opt/claude-usage-monitor' }}

      - name: Генерация .env и запуск
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DEPLOY_PATH,IMAGE_REF,GHCR_USER,GHCR_TOKEN,TG_TOKEN,TG_CHAT,ANTHROPIC_TOKEN,ANTHROPIC_REFRESH,POLL,THRESHOLDS,TZ_NAME,PROXY
          script_stop: true
          script: |
            set -e
            cd "$DEPLOY_PATH"
            # .env целиком пересобирается из секретов: источник правды — GitHub, не сервер
            cat > .env <<EOF
            IMAGE=$IMAGE_REF
            TELEGRAM_BOT_TOKEN=$TG_TOKEN
            TELEGRAM_CHAT_ID=$TG_CHAT
            ANTHROPIC_ACCESS_TOKEN=$ANTHROPIC_TOKEN
            ANTHROPIC_REFRESH_TOKEN=$ANTHROPIC_REFRESH
            POLL_INTERVAL=$POLL
            THRESHOLDS=$THRESHOLDS
            TIMEZONE=$TZ_NAME
            NOTIFY_ON_START=true
            NOTIFY_ON_RESET=true
            HTTPS_PROXY=$PROXY
            EOF
            chmod 600 .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
        env:
          IMAGE_REF: ${{ needs.image.outputs.image }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_TOKEN: ${{ secrets.ANTHROPIC_ACCESS_TOKEN }}
          ANTHROPIC_REFRESH: ${{ secrets.ANTHROPIC_REFRESH_TOKEN }}
          POLL: ${{ secrets.POLL_INTERVAL || '3m' }}
          THRESHOLDS: ${{ secrets.THRESHOLDS || '50,75,90,95' }}
          TZ_NAME: ${{ secrets.TIMEZONE || 'Europe/Moscow' }}
          PROXY: ${{ secrets.HTTPS_PROXY || '' }}
