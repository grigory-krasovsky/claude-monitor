spring.application.name=claude-usage-monitor
spring.main.banner-mode=off

# PostgreSQL: в docker compose адрес приходит из SPRING_DATASOURCE_*, по умолчанию — локальная база
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/monitor}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:monitor}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:monitor}

# Планировщик по умолчанию однопоточный: медленный опрос лимитов задерживал бы перерисовку статусов
spring.task.scheduling.pool.size=2

# Anthropic. Токены аккаунтов хранятся в базе; эти значения — только для импорта владельца
monitor.anthropic.access-token=${ANTHROPIC_ACCESS_TOKEN:}
monitor.anthropic.refresh-token=${ANTHROPIC_REFRESH_TOKEN:}
monitor.anthropic.token-file=${TOKEN_FILE:/data/tokens.json}
monitor.anthropic.user-agent=${ANTHROPIC_USER_AGENT:claude-code/2.1.220}
# Ключ AES-256 для токенов в базе: base64 от 32 байт (openssl rand -base64 32).
# Значения по умолчанию нет: без ключа приложение не стартует. Смена ключа = все заново шлют /token
monitor.token-encryption-key=${TOKEN_ENCRYPTION_KEY:}

# Telegram. TELEGRAM_CHAT_ID нужен только для импорта владельца
monitor.telegram.token=${TELEGRAM_BOT_TOKEN:}
monitor.telegram.chat-id=${TELEGRAM_CHAT_ID:}

# Мониторинг. Интервал опроса — TTL эндпоинта Anthropic (180 с), чаще нельзя.
monitor.poll-interval=${POLL_INTERVAL:3m}
# Как часто переписывается статусное сообщение из последнего среза данных
monitor.render-interval=${RENDER_INTERVAL:15s}
monitor.thresholds=${THRESHOLDS:50,75,90,95}
monitor.timezone=${TIMEZONE:Europe/Moscow}
# Необязательный HTTP-прокси для исходящих запросов, например http://10.0.0.1:3128
monitor.proxy=${HTTPS_PROXY:}

logging.level.com.example.claudeusagemonitor=INFO
logging.charset.console=UTF-8
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{20} - %msg%n
