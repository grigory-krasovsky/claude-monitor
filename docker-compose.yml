services:
  monitor:
    # На VPS образ тянется из GHCR: IMAGE прописывает деплой в .env.
    # Локальная сборка живёт в docker-compose.override.yml — на сервер он не копируется.
    image: ${IMAGE:-claude-usage-monitor:local}
    container_name: claude-usage-monitor
    restart: unless-stopped
    env_file: .env
    volumes:
      # Здесь переживают рестарт обновлённые OAuth-токены
      - monitor-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  monitor-data:
